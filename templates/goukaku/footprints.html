{% extends "goukaku/base.html" %}
{% block title %}{{ user_name }}の足跡{% endblock %}
{% block content %}
<header class="app-header"><a href="{{ url_for('goukaku_ui.home') }}" aria-label="戻る" class="icon-btn">‹</a><h1>{{ user_name }}の足跡</h1><button aria-label="閉じる" class="icon-btn close" data-close>×</button></header>
<div class="page-content"><p class="timeline-lead">数字だけでは見えない、小さな一歩と節目の記録です。</p><section class="card timeline">{% for event_date, text in events %}<article><i></i><time>{{ event_date }}</time><strong>{{ text }}</strong></article>{% endfor %}</section><p class="privacy-note">相談内容は表示せず、できたことだけを記録します。</p></div>
{% endblock %}
