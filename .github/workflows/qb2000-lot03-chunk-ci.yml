name: qb2000-lot03-chunk-ci

on:
  push:
    branches: [work/qb2000-lot03-active]
    paths:
      - 'staging/question_bank_2000_lot03_chunks_v01/**'
      - 'reports/question_bank_2000_lot03_chunk_validate.py'
      - 'reports/question_bank_2000_lot03_similarity_audit.py'
      - '.github/workflows/qb2000-lot03-chunk-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-authored-chunks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/qb2000-lot03-active
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate completed Lot03 chunks
        run: |
          set -e
          found=0
          for path in staging/question_bank_2000_lot03_chunks_v01/chunk_*.json; do
            [ -e "$path" ] || continue
            found=1
            n=$(basename "$path" .json | sed 's/chunk_//' | sed 's/^0*//')
            python -m reports.question_bank_2000_lot03_chunk_validate "$n"
            python -m reports.question_bank_2000_lot03_similarity_audit "$n"
          done
          if [ "$found" -eq 0 ]; then
            echo "No completed Lot03 chunks found"
            exit 1
          fi
      - name: Enforce no hard-near/near duplicates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          audits = sorted(Path('reports/question_bank_2000_lot03_similarity_audits').glob('chunk_*.json'))
          assert audits, 'similarity audit output missing'
          for path in audits:
              data = json.loads(path.read_text(encoding='utf-8'))
              assert data['exact_total'] == 0, (path, data['exact_total'])
              assert data['hard_near_total'] == 0, (path, data['hard_near_total'])
              assert data['near_total'] == 0, (path, data['near_total'])
          PY
      - name: Commit similarity audits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/question_bank_2000_lot03_similarity_audits
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi
          git commit -m "Audit Question Bank 2000 Lot03 authored chunks"
          git push origin HEAD:work/qb2000-lot03-active
