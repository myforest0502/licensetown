name: Phase11 Profile Accuracy Percent QA

"on":
  push:
    branches:
      - fix/phase11-profile-accuracy-percent-v01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/phase11-profile-accuracy-percent-v01

      - name: Apply patch
        run: |
          python scripts/apply_phase11_accuracy_percent_patch.py
          if ! git diff --quiet -- judgment_shadow.py templates/goukaku/supporter_pilot_diagnostics.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add judgment_shadow.py templates/goukaku/supporter_pilot_diagnostics.html
            git commit -m "Format Phase11 profile accuracy as percentage"
            git push origin HEAD:fix/phase11-profile-accuracy-percent-v01
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest "Werkzeug<3"

      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/test_phase11_profile_accuracy_percent.py \
            tests/test_judgment_shadow.py \
            tests/test_phase11_shadow_integration.py \
            tests/test_supporter.py

      - name: Full pytest
        run: >-
          python -m pytest -q
          --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8

      - name: Question Bank validator
        run: python scripts/validate_question_bank.py
