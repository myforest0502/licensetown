name: Aoi learner navigation v0.1

on:
  push:
    branches:
      - feature/learner-goukaku-navigation-v01

permissions:
  contents: write

jobs:
  integrate-test:
    if: ${{ !contains(github.event.head_commit.message, 'aoi-learner-navigation-auto') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/learner-goukaku-navigation-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration patch
        run: PYTHONPATH="$PWD" python scripts/apply_learner_navigation_v01.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Focused learner navigation tests
        run: |
          PYTHONPATH="$PWD" python -m pytest -q \
            tests/test_learner_readiness_presentation.py \
            tests/test_learner_goukaku_navigation_ui.py \
            tests/test_dashboard_real_data_shadow.py \
            tests/test_pass_readiness.py \
            tests/test_field_progress_ui.py \
            tests/test_dashboard_recommendation_cooldown.py
      - name: Full suite
        run: |
          PYTHONPATH="$PWD" python -m pytest -q \
            --deselect tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8
      - name: Commit integrated learner navigation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goukaku_ui.py app.py templates/goukaku/home.html static/goukaku/goukaku.js static/goukaku/goukaku.css
          if git diff --cached --quiet; then
            echo 'Integration already applied.'
            exit 0
          fi
          git commit -m 'feat: wire learner-facing 合格への道 navigation [aoi-learner-navigation-auto]'
          git push origin HEAD:feature/learner-goukaku-navigation-v01
