name: qb2000-lot03-integration

on:
  push:
    branches: [work/qb2000-lot03-active]
    paths:
      - '.github/workflows/qb2000-lot03-integration.yml'
      - 'scripts/set_question_bank_2000_lot03_new_node_prerequisites.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate-lot03:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PYTHONPATH: .
      OPENAI_API_KEY: test-key
      CHANNEL_ACCESS_TOKEN: test-token
      CHANNEL_SECRET: test-secret
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/qb2000-lot03-active
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Verify sealed Lot03 baseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('data/question_bank/bank_manifest.json').read_text(encoding='utf-8-sig'))
          assert manifest['question_count'] in (1857, 1905), manifest
          staging = json.loads(Path('staging/question_bank_2000_lot03_v01.json').read_text(encoding='utf-8-sig'))
          assert len(staging['drafts']) == 48
          assert staging.get('formal_hash_format') == 'sha256-lf-normalized-v1'
          PY
      - name: Run Lot03 dry-run integration tests
        run: python -m pytest -q tests/test_question_bank_2000_lot03_integration.py
      - name: Integrate Q1858-Q1905 formally
        run: |
          python -m scripts.integrate_question_bank_2000_lot03
          python -m scripts.set_question_bank_2000_lot03_new_node_prerequisites
          python -m scripts.generate_question_tags_audit
          python -m reports.question_bank_2000_remaining_allocation_v01
      - name: Validate formal bank and full suite
        run: |
          python -m pytest -q tests/test_question_bank_2000_lot03_integration.py
          python -m pytest -q --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8
          git diff --check
      - name: Commit formal Lot03 integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/question_bank reports staging/question_bank_2000_lot03_v01.json tests
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No formal integration changes to commit"
            exit 0
          fi
          git commit -m "Integrate Question Bank 2000 Lot03 Q1858-Q1905 [lot03-formal-integrated]"
          git push origin HEAD:work/qb2000-lot03-active
