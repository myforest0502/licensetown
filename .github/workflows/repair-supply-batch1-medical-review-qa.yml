name: Repair Supply Batch1 Medical Review QA

on:
  push:
    branches:
      - feature/repair-supply-phase2-batch1-q1606-q1610-v01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/repair-supply-phase2-batch1-q1606-q1610-v01
      - name: Apply medical review typo fixes
        run: |
          python scripts/fix_repair_supply_batch1_medical_review_typos.py
          if ! git diff --quiet -- data/question_bank/questions.json data/question_bank/explanations.json data/question_bank/question_tags.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/question_bank/questions.json data/question_bank/explanations.json data/question_bank/question_tags.json
            git commit -m "data: fix batch1 medical review terminology typos"
            git push origin HEAD:feature/repair-supply-phase2-batch1-q1606-q1610-v01
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest "Werkzeug<3"
      - name: Focused
        run: python -m pytest -q tests/test_repair_supply_phase2_batch1.py tests/test_question_bank.py tests/test_question_bank_schema.py tests/test_safety_strong_repair_pilot_v01.py
      - name: Full
        run: python -m pytest -q --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8
      - name: Validator
        run: python scripts/validate_question_bank.py
