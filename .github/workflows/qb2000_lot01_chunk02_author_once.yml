name: qb2000 lot01 chunk02 author once

on:
  push:
    branches:
      - analysis/qb2000-remaining-allocation-v01

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/qb2000-remaining-allocation-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Chunk02 authoring
        run: python -m reports.question_bank_2000_lot01_chunk02_apply
      - name: Validate completed Chunk02
        run: python -m reports.question_bank_2000_lot01_chunk_validate 2
      - name: Commit authored chunk and remove one-shot helpers
        run: |
          rm reports/question_bank_2000_lot01_chunk02_apply.py
          rm .github/workflows/qb2000_lot01_chunk02_author_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging/question_bank_2000_lot01_chunks_v01/chunk_02.json reports/question_bank_2000_lot01_chunk02_apply.py .github/workflows/qb2000_lot01_chunk02_author_once.yml
          git commit -m "Author Question Bank 2000 Lot01 Chunk02"
          git push
