name: Phase11 Promotion Evidence Bundle QA

"on":
  push:
    branches:
      - feature/phase11-promotion-evidence-bundle-v01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase11-promotion-evidence-bundle-v01
      - name: Normalize duplicate formatter definitions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("pilot_diagnostics.py")
          text = path.read_text(encoding="utf-8")
          marker = "\ndef _promotion_profile_text(profile):"
          positions = []
          start = 0
          while True:
              index = text.find(marker, start)
              if index < 0:
                  break
              positions.append(index)
              start = index + len(marker)
          if len(positions) > 2:
              raise SystemExit(f"unexpected promotion formatter definitions={len(positions)}")
          if len(positions) == 2:
              second = positions[1]
              end_marker = "\ndef build_pilot_diagnostics(user_id: str, period: str = \"7\", now=None):"
              end = text.find(end_marker, second)
              if end < 0:
                  raise SystemExit("build_pilot_diagnostics marker not found")
              text = text[:second] + text[end:]
              path.write_text(text, encoding="utf-8")
          PY
          if ! git diff --quiet -- pilot_diagnostics.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pilot_diagnostics.py
            git commit -m "Normalize Phase11 promotion evidence formatter"
            git push origin HEAD:feature/phase11-promotion-evidence-bundle-v01
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest "Werkzeug<3"
      - name: Focused
        run: >-
          python -m pytest -q
          tests/test_phase11_promotion_evidence_bundle.py
          tests/test_pilot_diagnostics.py
          tests/test_supporter.py
          tests/test_judgment_shadow.py
          tests/test_phase11_shadow_integration.py
      - name: Full
        run: >-
          python -m pytest -q
          --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8
      - name: Validator
        run: python scripts/validate_question_bank.py
