name: Phase11 Promotion Evidence Bundle QA

"on":
  push:
    branches:
      - feature/phase11-promotion-evidence-bundle-v01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase11-promotion-evidence-bundle-v01
      - name: Apply bundle patches
        run: |
          python scripts/apply_phase11_promotion_evidence_bundle_patch.py
          python scripts/enhance_phase11_promotion_evidence_bundle_patch.py
          if ! git diff --quiet -- pilot_diagnostics.py templates/goukaku/supporter_pilot_diagnostics.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pilot_diagnostics.py templates/goukaku/supporter_pilot_diagnostics.html
            git commit -m "Add Phase11 promotion evidence bundle"
            git push origin HEAD:feature/phase11-promotion-evidence-bundle-v01
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest "Werkzeug<3"
      - name: Focused
        run: >-
          python -m pytest -q
          tests/test_phase11_promotion_evidence_bundle.py
          tests/test_pilot_diagnostics.py
          tests/test_supporter.py
          tests/test_judgment_shadow.py
          tests/test_phase11_shadow_integration.py
      - name: Full
        run: >-
          python -m pytest -q
          --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8
      - name: Validator
        run: python scripts/validate_question_bank.py
