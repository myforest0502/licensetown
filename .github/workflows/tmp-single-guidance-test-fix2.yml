name: temporary final single guidance test update

on:
  push:
    branches:
      - work/dashboard-single-guidance-authority-v02

permissions:
  contents: write

jobs:
  patch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dashboard-single-guidance-authority-v02
      - name: Update remaining stale CTA expectations
        run: |
          python - <<'PY'
          from pathlib import Path
          edits = {
              Path('tests/test_field_progress_ui.py'): [
                  ('assert "チャレンジする！" in text', 'assert "今日の学習を始める" in text'),
              ],
              Path('tests/test_goukaku_ui.py'): [
                  ('assert "今日は解剖学を10問解こう" in home_text',
                   'assert "今日の学習を始める" in home_text'),
              ],
          }
          for path, replacements in edits.items():
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit regression updates
        run: |
          git config user.name "LicenseTown CI"
          git config user.email "licensetown.support@gmail.com"
          git add tests/test_field_progress_ui.py tests/test_goukaku_ui.py
          git diff --cached --quiet && exit 0
          git commit -m "Align remaining learner CTA expectations"
          git push origin HEAD:work/dashboard-single-guidance-authority-v02
