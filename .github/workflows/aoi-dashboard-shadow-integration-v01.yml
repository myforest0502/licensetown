name: Aoi dashboard shadow integration v0.1

on:
  push:
    branches:
      - feature/dashboard-real-data-shadow-integration-v01

permissions:
  contents: write

jobs:
  integrate-test:
    if: ${{ !contains(github.event.head_commit.message, 'aoi-shadow-integration-auto') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/dashboard-real-data-shadow-integration-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration patch
        run: PYTHONPATH="$PWD" python scripts/apply_dashboard_shadow_integration_ci.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Focused integration tests
        run: |
          PYTHONPATH="$PWD" python -m pytest -q \
            tests/test_dashboard_real_data_shadow.py \
            tests/test_dashboard_real_data_shadow_ui.py \
            tests/test_field_progress_ui.py
      - name: Full suite
        run: |
          PYTHONPATH="$PWD" python -m pytest -q \
            --deselect tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8
      - name: Commit integrated goukaku shadow path
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add goukaku_ui.py
          if git diff --cached --quiet; then
            echo 'Integration already applied.'
            exit 0
          fi
          git commit -m 'feat: wire dashboard real-data shadow path [aoi-shadow-integration-auto]'
          git push origin HEAD:feature/dashboard-real-data-shadow-integration-v01
