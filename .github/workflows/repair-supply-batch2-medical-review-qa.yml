name: Repair Supply Batch2 Medical Review QA

on:
  push:
    branches:
      - feature/repair-supply-phase2-batch2-q1611-q1615-v01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/repair-supply-phase2-batch2-q1611-q1615-v01
      - name: Apply medical review wording fixes
        run: |
          python scripts/fix_repair_supply_batch2_medical_review_wording.py
          if ! git diff --quiet -- data/question_bank/explanations.json docs/repair-supply-phase2-batch2-item-design-v02.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/question_bank/explanations.json docs/repair-supply-phase2-batch2-item-design-v02.md
            git commit -m "data: refine batch2 medical review wording"
            git push origin HEAD:feature/repair-supply-phase2-batch2-q1611-q1615-v01
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest "Werkzeug<3"
      - name: Focused
        run: python -m pytest -q tests/test_repair_supply_phase2_batch2.py tests/test_knowledge_node_repairability.py tests/test_question_bank.py tests/test_question_bank_schema.py tests/test_safety_strong_repair_pilot_v01.py
      - name: Full
        run: python -m pytest -q --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8
      - name: Validator
        run: python scripts/validate_question_bank.py
