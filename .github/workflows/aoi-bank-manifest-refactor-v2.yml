name: Aoi bank manifest refactor v2

on:
  push:
    branches:
      - feature/question-bank-manifest-v01

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, 'aoi-manifest-auto') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/question-bank-manifest-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Apply deterministic manifest refactor
        run: python scripts/apply_bank_manifest_refactor_ci.py
      - name: Verify focused contract
        run: |
          python scripts/check_question_bank_schema_manifest.py
          python scripts/validate_question_bank.py
          PYTHONPATH="$PWD" python -m pytest -q tests/test_question_bank_manifest.py tests/test_question_bank.py tests/test_question_bank_schema.py
      - name: Commit deterministic refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add question_bank.py scripts/validate_question_bank.py scripts/backfill_node_learning_history.py
          if git diff --cached --quiet; then
            echo 'No refactor changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: centralize question bank range via manifest [aoi-manifest-auto]'
          git push origin HEAD:feature/question-bank-manifest-v01
