name: Repair Supply Phase2 Context Extract

"on":
  push:
    branches:
      - analysis/repair-supply-phase2-batch1-context
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/repair-supply-phase2-batch1-context
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Extract source context
        run: |
          python scripts/extract_repair_supply_phase2_batch1_context.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/repair-supply-phase2-batch1-source-context.json
          if ! git diff --cached --quiet; then
            git commit -m "Extract Repair Supply Phase2 batch1 source context"
            git push origin HEAD:analysis/repair-supply-phase2-batch1-context
          fi
