name: qb2000-lot04-promote-formal-v2

on:
  push:
    branches: [work/qb2000-lot04-active]
    paths:
      - '.github/workflows/qb2000-lot04-promote-formal-v2.yml'
      - 'scripts/refresh_formal_count_tests_q1953.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      OPENAI_API_KEY: test-key
      CHANNEL_ACCESS_TOKEN: test-token
      CHANNEL_SECRET: test-secret
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qb2000-finish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: pip install -r requirements.txt pytest
      - name: Import reviewed Lot04 inputs
        run: |
          git fetch origin work/qb2000-lot04-active
          git checkout origin/work/qb2000-lot04-active -- \
            staging/question_bank_2000_lot04_v01.json \
            reports/question_bank_2000_lot04_validate.py \
            reports/question_bank_2000_lot04_targets_v01.json \
            reports/question_bank_2000_remaining_allocation_v01.py \
            scripts/integrate_question_bank_2000_lot04.py \
            scripts/set_question_bank_2000_lot04_new_node_prerequisites.py \
            scripts/refresh_formal_count_tests_q1953.py \
            tests/test_question_bank_2000_lot04_integration.py
          git diff --check
      - name: Dry-run integration
        run: python -m pytest -q tests/test_question_bank_2000_lot04_integration.py
      - name: Build Q1953 formal candidate
        run: |
          python -m scripts.integrate_question_bank_2000_lot04
          python -m scripts.set_question_bank_2000_lot04_new_node_prerequisites
          python -m scripts.generate_question_tags_audit
          python -m reports.question_bank_2000_remaining_allocation_v01
          python -m scripts.refresh_formal_count_tests_q1953
      - name: Verify updated count-sensitive tests
        run: |
          python -m pytest -q \
            tests/test_question_bank_2000_lot04_integration.py \
            tests/test_developer_status.py \
            tests/test_field_evidence.py \
            tests/test_field_progress.py \
            tests/test_knowledge_node_repairability.py \
            tests/test_overall_progress_ui.py \
            tests/test_past_exam_normal_import_47_51_lot2_v01.py \
            tests/test_progress_shadow_audit.py \
            tests/test_question_bank_2000_lot03_integration.py \
            tests/test_question_bank_2000_production_plan.py \
            tests/test_question_bank_schema.py
      - name: Run full suite
        run: python -m pytest -q --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8
      - name: Commit gated formal append
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Question Bank 2000 Lot04 Q1906-Q1953 [lot04-formal-integrated]"
          git push origin HEAD:qb2000-finish
