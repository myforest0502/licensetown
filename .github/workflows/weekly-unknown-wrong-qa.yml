name: Weekly Unknown Wrong Separation QA

"on":
  push:
    branches:
      - fix/weekly-unknown-wrong-separation-v01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/weekly-unknown-wrong-separation-v01

      - name: Apply patch
        run: |
          python scripts/apply_weekly_unknown_wrong_patch.py
          if ! git diff --quiet -- database.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add database.py
            git commit -m "Exclude unknown from weekly wrong-question diagnostics"
            git push origin HEAD:fix/weekly-unknown-wrong-separation-v01
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest "Werkzeug<3"

      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/test_weekly_unknown_wrong_separation.py \
            tests/test_learning_stats.py \
            tests/test_supporter.py

      - name: Full pytest
        run: >-
          python -m pytest -q
          --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8

      - name: Question Bank validator
        run: python scripts/validate_question_bank.py
