name: qb2000-batch02-generate

on:
  push:
    branches:
      - feature/question-bank-2000-batch02-integrator-v01
    paths:
      - '.github/workflows/qb2000_batch02_generate.yml'

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: test-key
      CHANNEL_ACCESS_TOKEN: test-token
      CHANNEL_SECRET: test-secret
      DATABASE_URL: ""
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/question-bank-2000-batch02-integrator-v01
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Preflight staging validation
        run: |
          python reports/question_bank_2000_batch02_validate.py
          python -m pytest -q tests/test_question_bank_2000_batch02_integration.py tests/test_question_bank_2000_batch02_staging.py
      - name: Generate formal Batch02 records
        run: python scripts/integrate_question_bank_2000_batch02.py
      - name: Validate generated formal bank
        run: |
          python reports/question_bank_2000_batch02_validate.py
          python reports/question_bank_2000_batch01_validate.py
          python scripts/validate_question_bank.py
          python scripts/check_question_bank_schema_manifest.py
          python -m pytest -q tests/test_question_bank_2000_batch02_integration.py tests/test_question_bank_2000_batch02_staging.py tests/test_question_bank_2000_batch01_integration.py tests/test_question_bank_schema.py tests/test_knowledge_node_repairability.py
          git diff --check
      - name: Restrict generated diff
        shell: bash
        run: |
          allowed=$(cat <<'EOF'
          data/question_bank/answers.json
          data/question_bank/bank_manifest.json
          data/question_bank/explanations.json
          data/question_bank/knowledge_nodes.json
          data/question_bank/question_tags.json
          data/question_bank/questions.json
          data/question_bank/schema/question_bank_schema_v1.json
          EOF
          )
          actual=$(git diff --name-only | sort)
          expected=$(printf '%s\n' "$allowed" | sed 's/^          //' | sed '/^$/d' | sort)
          if [ "$actual" != "$expected" ]; then
            echo "Unexpected generated diff"
            echo "Actual:"
            printf '%s\n' "$actual"
            echo "Expected:"
            printf '%s\n' "$expected"
            exit 1
          fi
      - name: Commit generated formal files and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            data/question_bank/answers.json \
            data/question_bank/bank_manifest.json \
            data/question_bank/explanations.json \
            data/question_bank/knowledge_nodes.json \
            data/question_bank/question_tags.json \
            data/question_bank/questions.json \
            data/question_bank/schema/question_bank_schema_v1.json
          git rm .github/workflows/qb2000_batch02_generate.yml
          git commit -m "Integrate Question Bank Batch02 formal records"
          git push origin HEAD:feature/question-bank-2000-batch02-integrator-v01
