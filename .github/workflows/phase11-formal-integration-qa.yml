name: Phase11 Formal Integration QA

on:
  push:
    branches:
      - feature/phase11-formal-integration-v01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/phase11-formal-integration-v01

      - name: Apply exact as_of symmetry patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("pilot_diagnostics.py")
          text = path.read_text(encoding="utf-8")
          old = '''    field_judgment_profiles = build_field_judgment_evidence_profiles(\n        all_attempts,\n        field_evidence,\n    )'''
          new = '''    field_judgment_profiles = build_field_judgment_evidence_profiles(\n        all_attempts,\n        field_evidence,\n        as_of=now,\n    )'''
          if new in text:
              print("as_of symmetry patch already present")
          else:
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one patch target, found {text.count(old)}")
              path.write_text(text.replace(old, new), encoding="utf-8")
              print("applied exact as_of symmetry patch")
          PY
          if ! git diff --quiet -- pilot_diagnostics.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pilot_diagnostics.py
            git commit -m "Pass identical as_of to Phase11 evidence profiles"
            git push origin HEAD:feature/phase11-formal-integration-v01
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest "Werkzeug<3"

      - name: Focused Phase11 formal tests
        run: |
          python -m pytest -q \
            tests/test_field_evidence.py \
            tests/test_evaluable_field_evidence.py \
            tests/test_knowledge_node_repair_cycle.py \
            tests/test_recheck_repair_cycle_reset.py \
            tests/test_retention_reference_metadata.py \
            tests/test_phase11_active_field_facts.py \
            tests/test_phase11_active_repair_rules.py \
            tests/test_phase11_active_safety.py \
            tests/test_phase11_active_weakness.py \
            tests/test_phase11_evaluable_nonrepair_rules.py \
            tests/test_phase11_retention_field_facts.py \
            tests/test_phase11_formal_judgment.py \
            tests/test_knowledge_node_state_transition.py \
            tests/test_node_spaced_retention.py \
            tests/test_judgment_shadow.py \
            tests/test_safety_strong_repair_pilot_v01.py \
            tests/test_repairability_diagnostics.py \
            tests/test_phase11_shadow_integration.py \
            tests/test_repair_confirmation_node_guard.py

      - name: Full pytest except known unmanaged fixture
        run: >-
          python -m pytest -q
          --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8

      - name: Question Bank validator
        run: python scripts/validate_question_bank.py
