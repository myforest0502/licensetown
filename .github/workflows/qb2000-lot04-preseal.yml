name: qb2000-lot04-preseal

on:
  push:
    branches: [work/qb2000-lot04-active]
    paths:
      - 'reports/question_bank_2000_lot04_preseal_audit.py'
      - '.github/workflows/qb2000-lot04-preseal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  preseal-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/qb2000-lot04-active
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply medically coherent quota repair and replace colliding new Node
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path('staging/question_bank_2000_lot04_chunks_v01')
          files=sorted(root.glob('chunk_*.json'))
          payloads={p:json.loads(p.read_text(encoding='utf-8-sig')) for p in files}
          rows={d['draft_id']:(p,d) for p,x in payloads.items() for d in x['drafts']}

          def set_review(d, task, ability, candidate, why):
              d['proposed_task']=task
              d['primary_ability']=ability
              d['semantic_review']['candidate_demand']=candidate
              d['semantic_review']['why_not_same_demand']=why
              d['semantic_review']['decision']='accepted'
              d['semantic_review']['reviewer']='Aoi/GPT-5.6 Sol medical-structure review (AI; not human expert)'
              d['semantic_review']['reviewed_on']='2026-09-09'
              d['semantic_review']['expert_signoff']=False
              d['reviewed_sha256']=''
              d['assignment_status']='author-adjusted-for-medical-fit-and-quota'

          # 1) Central cord syndrome: use the characteristic hand-predominant deficit to select an ADL aid.
          d=rows['L04-C9-M01'][1]
          d.update({
              'title':'中心性脊髄損傷の自助具選択',
              'question_text':'中心性脊髄損傷で歩行は監視下で可能だが、手指の把持力低下が強く食事動作でスプーンを保持できない。自立度を高めるため最も適切な自助具はどれか。',
              'choices':{'1':'ユニバーサルカフ','2':'頸椎カラー','3':'膝装具','4':'短下肢装具','5':'弾性ストッキング'},
              'correct_choices':['1'],
              'explanation':'中心性脊髄損傷では下肢より上肢、とくに手指機能の障害が強く残ることがある。把持が困難でも食具を保持できるユニバーサルカフは食事動作の自立を補助する。',
              'choice_explanations':{'1':'○。手指把持が弱い場合に食具を手へ固定してADLを補助できる。','2':'頸椎保護の適応判断は別問題で、食具把持の代償にはならない。','3':'膝装具は手指把持障害を補償しない。','4':'短下肢装具は足関節機能を補助する装具である。','5':'弾性ストッキングは把持障害への自助具ではない。'},
              'level':2,'safety':'none','clinical_intent':'中心性脊髄損傷に特徴的な手指優位の障害から、食事動作を補う自助具を選択する。'
          })
          set_review(d,'device_selection','PRESCRIBE','device_selection/PRESCRIBE: 手指優位の障害からADL自助具を選ぶ。','既存問題は中心性脊髄損傷の特徴・診断的解釈を問う。本問は残存する手指障害を具体的な自助具選択へ結びつける。')

          # 2) ICF environmental factors: choose an environmental assistive product rather than a generic intervention.
          d=rows['L04-C6-M01'][1]
          d.update({
              'title':'ICF環境因子としての福祉用具選択',
              'question_text':'在宅復帰予定の患者は屋内歩行が可能だが、浴室で立ち座り時の支持物がなく不安定である。ICFの環境因子を促進因子へ変えるため最も適切な用具はどれか。',
              'choices':{'1':'浴室用手すり','2':'遮光眼鏡','3':'頸椎カラー','4':'補聴器','5':'上肢用スリング'},
              'correct_choices':['1'],
              'explanation':'ICFの環境因子には製品・技術が含まれる。浴室で支持物が不足している状況では、手すりを導入することで環境を促進因子へ変え、立ち座りの安定性を補える。',
              'choice_explanations':{'1':'○。浴室環境の不足を補う製品・技術として適切である。','2':'視覚過敏などの適応がない本例では浴室の支持不足を解決しない。','3':'頸椎保護の適応は示されていない。','4':'聴覚障害の情報はなく浴室支持を補わない。','5':'上肢支持の適応は示されておらず浴室環境の問題を直接解決しない。'},
              'level':2,'safety':'none','clinical_intent':'ICFの環境因子のうち製品・技術を、具体的な福祉用具選択へ応用する。'
          })
          set_review(d,'device_selection','PRESCRIBE','device_selection/PRESCRIBE: 環境因子を促進因子へ変える福祉用具を選ぶ。','既存問題はICF環境因子の分類知識を問う。本問は生活場面の障壁を読み取り、製品・技術を選択させる。')

          # 3) Cognitive distortion: preserve clinical fit while changing from intervention action to functional goal selection.
          d=rows['L04-C10-M01'][1]
          d.update({
              'title':'極端な一般化に対する短期目標',
              'question_text':'一度歩行練習で失敗した後、「私は何をしても必ず失敗する」と話す患者に対する短期目標として最も適切なのはどれか。',
              'choices':{'1':'成功・失敗を具体的事実ごとに捉え直せる','2':'失敗を避けるため全活動を中止する','3':'否定的な出来事だけを記憶する','4':'一度の失敗を将来すべてに一般化する','5':'自分の考えを検討せず固定する'},
              'correct_choices':['1'],
              'explanation':'一つの出来事から「何をしても失敗する」と結論づけるのは極端な一般化である。短期目標は、個々の事実を区別し、過度な一般化をせず現実的に捉え直せることが適切である。',
              'choice_explanations':{'1':'○。極端な一般化を弱める具体的で評価可能な目標である。','2':'回避を固定化するため適切でない。','3':'否定的情報への偏りを強める。','4':'認知の歪みそのものを目標にしてしまう。','5':'認知を柔軟に検討する方向と逆である。'},
              'level':3,'safety':'none','clinical_intent':'極端な一般化を認識し、より具体的で現実的な認知を形成する短期目標を選ぶ。'
          })
          set_review(d,'functional_goal_decision','DECIDE','functional_goal_decision/DECIDE: 認知の歪みに対する達成目標を選ぶ。','既存問題は歪みの名称・同定を問う。本問は同定した歪みから、治療で目指す具体的状態を決定させる。')

          # 4) Hypoglossal dysfunction: convert assessment task to a function-oriented rehabilitation goal.
          d=rows['L04-C18-M01'][1]
          d.update({
              'title':'舌運動障害の機能目標',
              'question_text':'延髄病変後に舌の運動低下があり、食塊形成と口腔内での送り込みに時間を要している。短期的な機能目標として最も適切なのはどれか。',
              'choices':{'1':'舌運動を利用した食塊形成・送り込みの効率を高める','2':'下肢筋力だけを最大化する','3':'視野を拡大する','4':'聴力を改善する','5':'手指巧緻性だけを改善する'},
              'correct_choices':['1'],
              'explanation':'舌下神経は舌運動を担うため、延髄病変で舌運動が低下すると口腔期の食塊形成・送り込みに影響する。障害機能に直接結びつく目標を設定する。',
              'choice_explanations':{'1':'○。舌運動障害が生じている機能へ直接対応する目標である。','2':'下肢筋力は提示された主要障害と直接対応しない。','3':'視野障害は示されていない。','4':'聴覚障害は示されていない。','5':'手指巧緻性は本例の主要障害ではない。'},
              'level':3,'safety':'none','clinical_intent':'舌下神経機能障害から影響を受ける口腔機能を特定し、短期機能目標を決定する。'
          })
          set_review(d,'functional_goal_decision','DECIDE','functional_goal_decision/DECIDE: 舌運動障害から口腔機能の目標を決める。','既存問題は延髄・舌下神経の知識や所見解釈を問う。本問は障害された舌運動を具体的な機能目標へ変換させる。')

          # 5) Malnutrition/pressure-risk Node: retain high safety context but ask for a functional rehabilitation goal.
          d=rows['L04-C8-S01'][1]
          d.update({
              'title':'低栄養と皮膚リスクを踏まえた機能目標',
              'question_text':'著明な体重減少と低栄養があり仙骨部に発赤を認める入院患者で、離床能力の低下もみられる。短期目標として最も適切なのはどれか。',
              'choices':{'1':'栄養・除圧管理と並行して安全な離床時間を段階的に延ばす','2':'発赤部へ長時間圧をかけ続ける','3':'栄養状態を無視して最大負荷訓練のみ行う','4':'食事摂取を減らしてさらに減量する','5':'皮膚状態を確認せず終日同一姿勢を保つ'},
              'correct_choices':['1'],
              'explanation':'低栄養は筋量低下や創傷治癒遅延、褥瘡リスクと関連する。機能回復を目指す場合も栄養・除圧管理を並行し、安全性を確保しながら離床量を段階的に増やす目標が適切である。',
              'choice_explanations':{'1':'○。リスク管理と機能回復を両立した具体的目標である。','2':'発赤部への持続圧は悪化につながり得る。','3':'低栄養と皮膚リスクを無視している。','4':'さらなる低栄養を招く。','5':'褥瘡リスク管理に反する。'},
              'level':4,'safety':'critical','clinical_intent':'低栄養・皮膚障害リスクを踏まえ、安全管理と離床機能を両立する短期目標を決定する。'
          })
          set_review(d,'functional_goal_decision','DECIDE','functional_goal_decision/DECIDE: 高リスク状態で安全性と離床機能を両立する目標を決める。','Q629は低栄養と関連する問題を問う。本問は低栄養・皮膚所見を機能回復目標の優先順位へ変換させる。')

          # Safety tagging correction: these are interpretation/prognostic content, not safety-priority content.
          rows['L04-C7-S01'][1]['safety']='none'; rows['L04-C7-S01'][1]['reviewed_sha256']=''
          rows['L04-C7-S02'][1]['safety']='none'; rows['L04-C7-S02'][1]['reviewed_sha256']=''

          # Replace the colliding Fick new Node (already formalized as KN1548) with a distinct cardiac electrophysiology fact.
          d=rows['L04-C2-N01'][1]
          d.update({
              'target_node_id':None,
              'target_node_label':'心室筋活動電位の第2相ではL型Ca2+チャネルからのCa2+流入がK+流出と釣り合いプラトー相を形成する',
              'title':'心室筋活動電位のプラトー相',
              'question_text':'心室筋細胞の活動電位で、第2相のプラトーを形成する主要な内向き電流はどれか。',
              'choices':{'1':'L型Ca2+チャネルを介するCa2+流入','2':'Cl−チャネルを介するCl−流入','3':'Na+/K+-ATPaseによるK+流入のみ','4':'K+チャネルを介するK+流出のみ','5':'Ca2+ポンプによるCa2+排出'},
              'correct_choices':['1'],
              'explanation':'心室筋活動電位の第2相ではL型Ca2+チャネルからCa2+が流入し、同時に生じるK+流出と電流が釣り合うことでプラトー相が形成される。',
              'choice_explanations':{'1':'○。第2相の主要な内向き電流である。','2':'Cl−流入は心室筋第2相の主要機序ではない。','3':'Na+/K+-ATPaseはイオン勾配維持に重要だがプラトー相の主要内向き電流ではない。','4':'K+流出は外向き電流であり、Ca2+流入と釣り合う。','5':'Ca2+排出はプラトー形成の主要内向き電流ではない。'},
              'proposed_task':'fact_recall','primary_ability':'KNOW','secondary_ability':None,'level':1,'safety':'none',
              'clinical_intent':'心室筋活動電位第2相の主要イオン電流を想起する。',
              'new_node_collision_review':{'decision':'accepted_new_node','why_existing_nodes_insufficient':'Formal Q1-Q1905 contains no equivalent canonical Node for ventricular-myocyte phase-2 plateau formation by L-type Ca2+ influx balanced against K+ efflux; the prior Fick candidate was rejected because KN1548 is identical.','reviewer':'Aoi/GPT-5.6 Sol medical-structure review (AI; not human expert)','reviewed_on':'2026-09-09'},
              'evidence':[{'url':'https://www.ncbi.nlm.nih.gov/books/NBK537194/','support':'NCBI StatPearls describes phase 2 of the cardiomyocyte action potential as L-type Ca2+ influx balanced by K+ efflux, producing the plateau.'}],
              'reviewed_sha256':'','assignment_status':'author-replaced-new-node-after-formal-collision','assignment_may_change_if_quotas_preserved':True
          })
          d['semantic_review']={'reference_demand':'new Node candidate; no formal same-Node reference','candidate_demand':'fact_recall/KNOW: 心室筋活動電位第2相の主要内向きCa2+電流を想起する。','why_not_same_demand':'既存Nodeへの追加ではなく、正式バンクに同等canonical Nodeがないことを再監査して新規Node候補とする。','related_formal_questions':[],'decision':'accepted','reviewer':'Aoi/GPT-5.6 Sol medical-structure review (AI; not human expert)','reviewed_on':'2026-09-09','expert_signoff':False}

          for p,x in payloads.items():
              p.write_text(json.dumps(x,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Revalidate all chunks and regenerate similarity audits
        run: |
          for n in 1 2 3 4 5 6; do
            python -m reports.question_bank_2000_lot04_chunk_validate $n
            python -m reports.question_bank_2000_lot04_similarity_audit $n
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path('reports/question_bank_2000_lot04_similarity_audits').glob('chunk_*.json')):
              x=json.loads(p.read_text(encoding='utf-8'))
              assert x['exact_total']==0 and x['hard_near_total']==0, (p,x['exact_total'],x['hard_near_total'])
          PY
      - name: Run Lot04 aggregate pre-seal audit
        run: python -m reports.question_bank_2000_lot04_preseal_audit
      - name: Commit repaired chunks and audit results
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging/question_bank_2000_lot04_chunks_v01 reports/question_bank_2000_lot04_similarity_audits reports/question_bank_2000_lot04_preseal_audit.json
          git diff --cached --check
          git commit -m "Repair and preseal-validate Question Bank 2000 Lot04"
          git push origin HEAD:work/qb2000-lot04-active
