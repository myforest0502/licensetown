name: temporary single guidance patch

on:
  push:
    branches:
      - work/dashboard-single-guidance-authority-v02

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dashboard-single-guidance-authority-v02
      - name: Hide legacy guidance when formal learner navigation is active
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('templates/goukaku/home.html')
          text = path.read_text(encoding='utf-8')
          old = '  <div class="guidance-stack">\n    <section class="card weak-card">'
          new = '  <div class="guidance-stack">\n    {% if not dashboard.learner_navigation_enabled %}\n    <section class="card weak-card">'
          if old not in text:
              raise SystemExit('guidance-stack anchor not found')
          text = text.replace(old, new, 1)
          old2 = '    <article class="motivation-card gensan-card">'
          new2 = '    {% endif %}\n    <article class="motivation-card gensan-card">'
          if old2 not in text:
              raise SystemExit('gensan anchor not found')
          text = text.replace(old2, new2, 1)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit template change
        run: |
          git config user.name "LicenseTown CI"
          git config user.email "licensetown.support@gmail.com"
          git add templates/goukaku/home.html
          git diff --cached --quiet && exit 0
          git commit -m "Hide legacy learner guidance under formal navigation"
          git push origin HEAD:work/dashboard-single-guidance-authority-v02
