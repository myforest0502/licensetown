name: Aoi dashboard cooldown unification v0.1

on:
  push:
    branches:
      - feature/unify-dashboard-recent-cooldown-v01

permissions:
  contents: write

jobs:
  integrate-test:
    if: ${{ !contains(github.event.head_commit.message, 'aoi-dashboard-cooldown-auto') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/unify-dashboard-recent-cooldown-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply integration patch
        run: PYTHONPATH="$PWD" python scripts/apply_dashboard_cooldown_unification.py
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Focused cooldown tests
        run: |
          PYTHONPATH="$PWD" python -m pytest -q \
            tests/test_dashboard_recommendation_cooldown.py \
            tests/test_adaptive_question_selector.py \
            tests/test_dashboard_recommendation_web.py
      - name: Full suite
        run: |
          PYTHONPATH="$PWD" python -m pytest -q \
            --deselect tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8
      - name: Commit integrated cooldown path
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py adaptive_question_selector.py
          if git diff --cached --quiet; then
            echo 'Integration already applied.'
            exit 0
          fi
          git commit -m 'fix: centralize dashboard exact-Q selection [aoi-dashboard-cooldown-auto]'
          git push origin HEAD:feature/unify-dashboard-recent-cooldown-v01
