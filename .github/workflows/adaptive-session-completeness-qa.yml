name: Adaptive Session Completeness QA

"on":
  push:
    branches:
      - fix/adaptive-session-completeness-v01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/adaptive-session-completeness-v01

      - name: Apply patch
        run: |
          python scripts/apply_adaptive_session_completeness_patch.py
          if ! git diff --quiet -- pilot_diagnostics.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pilot_diagnostics.py
            git commit -m "Harden adaptive session completeness diagnostics"
            git push origin HEAD:fix/adaptive-session-completeness-v01
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest "Werkzeug<3"

      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/test_adaptive_session_completeness.py \
            tests/test_pilot_diagnostics.py \
            tests/test_repeat_structure_diagnostics.py

      - name: Full pytest
        run: >-
          python -m pytest -q
          --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8

      - name: Question Bank validator
        run: python scripts/validate_question_bank.py
