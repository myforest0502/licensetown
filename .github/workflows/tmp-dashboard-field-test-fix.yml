name: temporary dashboard field test update

on:
  push:
    branches:
      - work/dashboard-formal-field-progress-v02

permissions:
  contents: write

jobs:
  patch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dashboard-formal-field-progress-v02
      - name: Update expectations for formal learner field progress
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              Path('tests/test_dashboard_formal_field_progress.py'): [
                  ('"progress_percent" in field', '"progress_display" in field'),
                  ('"accuracy_label" in field', '"accuracy_display" in field'),
              ],
              Path('tests/test_goukaku_ui.py'): [
                  ('assert "まだデータがありません。勉強するとここに表示されます＾＾" in text',
                   'assert "field-progress-row" in text\n    assert "正答率" in text'),
              ],
              Path('tests/test_overall_progress_ui.py'): [
                  ('assert "field-progress-row" not in owner',
                   'assert "field-progress-row" in owner'),
              ],
          }

          for path, edits in replacements.items():
              text = path.read_text(encoding='utf-8')
              for old, new in edits:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit updated tests
        run: |
          git config user.name "LicenseTown CI"
          git config user.email "licensetown.support@gmail.com"
          git add tests/test_dashboard_formal_field_progress.py tests/test_goukaku_ui.py tests/test_overall_progress_ui.py
          git diff --cached --quiet && exit 0
          git commit -m "Update field progress regression expectations"
          git push origin HEAD:work/dashboard-formal-field-progress-v02
