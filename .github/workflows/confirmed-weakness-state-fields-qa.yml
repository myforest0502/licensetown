name: Confirmed Weakness State Fields QA

"on":
  push:
    branches:
      - feature/confirmed-weakness-state-fields-v01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: feature/confirmed-weakness-state-fields-v01

      - name: Apply patch
        run: |
          python scripts/apply_confirmed_weakness_state_fields_patch.py
          if ! git diff --quiet -- knowledge_node_state_transition.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add knowledge_node_state_transition.py
            git commit -m "Separate confirmed weakness from unknown repair triggers"
            git push origin HEAD:feature/confirmed-weakness-state-fields-v01
          fi

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest "Werkzeug<3"

      - name: Focused tests
        run: |
          python -m pytest -q \
            tests/test_confirmed_weakness_state_fields.py \
            tests/test_knowledge_node_state_transition.py \
            tests/test_phase11_active_safety.py \
            tests/test_phase11_active_weakness.py \
            tests/test_phase11_formal_judgment.py

      - name: Full pytest
        run: >-
          python -m pytest -q
          --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8

      - name: Question Bank validator
        run: python scripts/validate_question_bank.py
