name: tmp-fix-dashboard-blank-space
on:
  push:
    branches:
      - fix/dashboard-blank-space-v01
permissions:
  contents: write
jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-blank-space-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Patch dashboard layout
        run: |
          python - <<'PY'
          from pathlib import Path

          js = Path('static/goukaku/dashboard-layout-v05.js')
          s = js.read_text(encoding='utf-8')
          old = '''  if (weeklyCard) {\n    weeklyCard.classList.add('weekly-learning-card-full');\n    story.insertAdjacentElement('afterend', weeklyCard);\n  }\n'''
          new = '''  if (weeklyCard) {\n    // Keep "学習の現在地" in the left story column and use the natural\n    // empty space on the right for the 7-day learning record instead of\n    // forcing a full-width row below the taller left column.\n    weeklyCard.classList.remove('weekly-learning-card-full');\n    guidanceStack.appendChild(weeklyCard);\n  }\n'''
          if old not in s:
              raise SystemExit('weekly layout block not found')
          js.write_text(s.replace(old, new, 1), encoding='utf-8')

          base = Path('templates/goukaku/base.html')
          b = base.read_text(encoding='utf-8')
          oldv = "filename='goukaku/dashboard-layout-v05.js', v='20260907-v07'"
          newv = "filename='goukaku/dashboard-layout-v05.js', v='20260909-v08'"
          if oldv not in b:
              raise SystemExit('dashboard layout JS cache token not found')
          base.write_text(b.replace(oldv, newv, 1), encoding='utf-8')

          test = Path('tests/test_dashboard_blank_space_layout.py')
          test.write_text('''from pathlib import Path\n\n\ndef test_weekly_card_fills_right_story_column_instead_of_forcing_blank_row():\n    js = Path("static/goukaku/dashboard-layout-v05.js").read_text(encoding="utf-8")\n    assert "guidanceStack.appendChild(weeklyCard);" in js\n    assert "story.insertAdjacentElement('afterend', weeklyCard);" not in js\n\n\ndef test_dashboard_layout_cache_token_is_bumped():\n    base = Path("templates/goukaku/base.html").read_text(encoding="utf-8")\n    assert "dashboard-layout-v05.js', v='20260909-v08'" in base\n''', encoding='utf-8')

          state = Path('docs/CURRENT_STATE.md')
          cs = state.read_text(encoding='utf-8')
          marker = '## Current completion contract — MAIN LINE ONLY\n'
          note = '''## 2026-09-09 Dashboard whitespace defect\n\n- Real learner screenshot after the `/goukaku-no-michi` 500 repair showed a large unnecessary blank region in the right story column beside `学習の現在地`.\n- Cause: `dashboard-layout-v05.js` kept `学習の現在地` in the taller left column but forcibly moved the 7-day learning card to a new full-width row below the two-column story. CSS Grid therefore had to preserve the left-column height and left a large empty right area.\n- Fix branch: `fix/dashboard-blank-space-v01`. Keep `学習の現在地` on the left and place the 7-day learning record into the right story stack so the existing space is used naturally; mobile remains one-column through the existing breakpoint.\n- Status: **real Production screenshot observed: YES / root cause identified: YES / code fix under validation / Production accepted: NO**.\n\n'''
          if note not in cs:
              if marker not in cs:
                  raise SystemExit('CURRENT_STATE marker not found')
              state.write_text(cs.replace(marker, note + marker, 1), encoding='utf-8')
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run focused and full tests
        run: |
          python -m pytest -q tests/test_dashboard_blank_space_layout.py
          python -m pytest -q --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add static/goukaku/dashboard-layout-v05.js templates/goukaku/base.html tests/test_dashboard_blank_space_layout.py docs/CURRENT_STATE.md
          git commit -m "Fix dashboard blank story space"
          git push origin HEAD:fix/dashboard-blank-space-v01
