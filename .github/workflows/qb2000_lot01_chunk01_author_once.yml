name: qb2000 lot01 chunk01 author once

on:
  push:
    branches:
      - analysis/qb2000-remaining-allocation-v01

permissions:
  contents: write

jobs:
  author:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/qb2000-remaining-allocation-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Apply Chunk01 authoring
        run: python reports/question_bank_2000_lot01_chunk01_apply.py
      - name: Validate completed Chunk01
        run: python reports/question_bank_2000_lot01_chunk_validate.py 1
      - name: Commit authored chunk and remove one-shot helpers
        run: |
          rm reports/question_bank_2000_lot01_chunk01_apply.py
          rm .github/workflows/qb2000_lot01_chunk01_author_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging/question_bank_2000_lot01_chunks_v01/chunk_01.json reports/question_bank_2000_lot01_chunk01_apply.py .github/workflows/qb2000_lot01_chunk01_author_once.yml
          git commit -m "Author Question Bank 2000 Lot01 Chunk01"
          git push
