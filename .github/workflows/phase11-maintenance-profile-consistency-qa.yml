name: Phase11 Maintenance Profile Consistency QA

"on":
  push:
    branches:
      - fix/maintenance-profile-consistency-v01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/maintenance-profile-consistency-v01
      - name: Apply patch
        run: |
          python scripts/apply_maintenance_profile_consistency_patch.py
          if ! git diff --quiet -- judgment_shadow.py; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add judgment_shadow.py
            git commit -m "Treat targetless maintenance profile as consistent"
            git push origin HEAD:fix/maintenance-profile-consistency-v01
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest "Werkzeug<3"
      - name: Focused
        run: python -m pytest -q tests/test_phase11_maintenance_profile_consistency.py tests/test_judgment_shadow.py tests/test_phase11_shadow_integration.py tests/test_supporter.py
      - name: Full
        run: >-
          python -m pytest -q
          --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8
      - name: Validator
        run: python scripts/validate_question_bank.py
