name: tmp-dashboard-approved-layout
on:
  push:
    branches:
      - fix/dashboard-approved-layout-v01
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-approved-layout-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Update CURRENT_STATE
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text(encoding='utf-8')
          marker = '## Current completion contract — MAIN LINE ONLY\n'
          note = '''## 2026-09-09 Dashboard approved production layout\n\n- Boss approved the final desktop composition for `/goukaku-no-michi`: the large `合格までの推奨ルート` is placed immediately below the top date/exam/progress summary and before the daily-action/navigation area.\n- No learner-facing information card may be deleted to make the route larger. The preserved content set includes `今日やること`, `分野別到達度`, `源さんの一言`, `知識の確認状況`, `今の学習カルテ`, `定着までの進み方`, `直近7日間の学習記録`, `LTの作戦メモ`, `学習の現在地`, `あなたの足跡を見る`, and `次のチェックポイント`.\n- Desktop story rails are intentionally balanced: left = field progress -> LT strategy memo -> learning position -> footprints; right = Gen-san -> knowledge status -> learning chart/profile -> retention flow -> weekly record -> next checkpoint. Mobile remains a single-column flow.\n- The formal Gen-san production asset remains `static/images/characters/gensan_main.png`; generated mockup faces are never production assets.\n- Implementation branch: `fix/dashboard-approved-layout-v01`, using `dashboard-approved-layout-v01.js/css` loaded last so the approved hierarchy wins over older layout scripts without deleting their content-generation logic.\n- Status: **Boss layout approval: YES / code exists: YES / automated validation pending / Production deployed: NO / real-device acceptance: PENDING**.\n\n'''
          if note not in s:
              if marker not in s:
                  raise SystemExit('CURRENT_STATE marker missing')
              s = s.replace(marker, note + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: |
          python -m pytest -q tests/test_dashboard_approved_layout.py tests/test_dashboard_blank_space_layout.py
          python -m pytest -q --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8
      - name: Commit state update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record approved dashboard production layout"
          git push origin HEAD:fix/dashboard-approved-layout-v01
