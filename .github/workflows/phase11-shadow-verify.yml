name: Phase11 Shadow Verify

on:
  push:
    branches:
      - feature/phase11-judgment-shadow-v01

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OPENAI_API_KEY: x
      CHANNEL_ACCESS_TOKEN: x
      CHANNEL_SECRET: x
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Phase 11 focused tests
        run: python -m pytest -q tests/test_judgment_shadow.py tests/test_phase11_shadow_integration.py tests/test_pilot_diagnostics.py
      - name: Full regression
        run: python -m pytest -q
