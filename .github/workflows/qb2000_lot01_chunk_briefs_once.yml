name: qb2000 lot01 chunk briefs once

on:
  push:
    branches:
      - analysis/qb2000-remaining-allocation-v01

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/qb2000-remaining-allocation-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build chunk briefs
        run: python reports/question_bank_2000_lot01_chunk_briefs.py
      - name: Commit briefs and remove one-shot workflow
        run: |
          rm .github/workflows/qb2000_lot01_chunk_briefs_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/question_bank_2000_lot01_chunk_briefs_v01 .github/workflows/qb2000_lot01_chunk_briefs_once.yml
          git commit -m "Record Question Bank 2000 Lot01 chunk briefs"
          git push
