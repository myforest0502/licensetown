name: Aoi bank manifest refactor one-shot

on:
  push:
    branches:
      - feature/question-bank-manifest-v01

permissions:
  contents: write

jobs:
  refactor:
    if: ${{ !contains(github.event.head_commit.message, 'aoi-manifest-auto') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/question-bank-manifest-v01
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic manifest refactor
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # question_bank.py: replace the hard-coded declared range with manifest-backed values.
          path = Path('question_bank.py')
          text = path.read_text(encoding='utf-8')
          old = '''QUESTION_BANK_DIR = Path(__file__).resolve().parent / "data" / "question_bank"\nEXPECTED_QUESTION_COUNT = 1737\nEXPECTED_QUESTION_IDS = {\n    f"Q{number}" for number in range(1, EXPECTED_QUESTION_COUNT + 1)\n}\n'''
          new = '''QUESTION_BANK_DIR = Path(__file__).resolve().parent / "data" / "question_bank"\nBANK_MANIFEST_PATH = QUESTION_BANK_DIR / "bank_manifest.json"\n\n\ndef _load_bank_manifest() -> dict:\n    data = json.loads(BANK_MANIFEST_PATH.read_text(encoding="utf-8-sig"))\n    if not isinstance(data, dict):\n        raise ValueError("bank_manifest.json must contain a JSON object")\n    required = {\n        "bank_version", "first_question_number", "last_question_number", "question_count"\n    }\n    missing = required - set(data)\n    if missing:\n        raise ValueError(f"bank_manifest.json missing: {sorted(missing)}")\n    first = data["first_question_number"]\n    last = data["last_question_number"]\n    count = data["question_count"]\n    if not isinstance(data["bank_version"], str) or not data["bank_version"].strip():\n        raise ValueError("bank_manifest.json bank_version must be a non-empty string")\n    if not all(type(value) is int for value in (first, last, count)):\n        raise ValueError("bank_manifest.json range/count values must be integers")\n    if first < 1 or last < first or count != last - first + 1:\n        raise ValueError("bank_manifest.json range/count contract is inconsistent")\n    return data\n\n\n_BANK_MANIFEST = _load_bank_manifest()\nQUESTION_BANK_VERSION = _BANK_MANIFEST["bank_version"]\nFIRST_QUESTION_NUMBER = _BANK_MANIFEST["first_question_number"]\nLAST_QUESTION_NUMBER = _BANK_MANIFEST["last_question_number"]\nEXPECTED_QUESTION_COUNT = _BANK_MANIFEST["question_count"]\nEXPECTED_QUESTION_IDS = {\n    f"Q{number}" for number in range(FIRST_QUESTION_NUMBER, LAST_QUESTION_NUMBER + 1)\n}\n'''
          assert old in text, 'question_bank.py expected range block not found'
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # validate_question_bank.py: consume the same declared manifest instead of a second literal.
          path = Path('scripts/validate_question_bank.py')
          text = path.read_text(encoding='utf-8')
          old = '''DEFAULT_BANK_DIR = REPOSITORY_ROOT / "data" / "question_bank"\nDEFAULT_SCHEMA_PATH = DEFAULT_BANK_DIR / "schema" / "question_bank_schema_v1.json"\nDEFAULT_REGISTRY_PATH = DEFAULT_BANK_DIR / "knowledge_nodes.json"\nQUESTION_BANK_FILES = {\n'''
          new = '''DEFAULT_BANK_DIR = REPOSITORY_ROOT / "data" / "question_bank"\nDEFAULT_SCHEMA_PATH = DEFAULT_BANK_DIR / "schema" / "question_bank_schema_v1.json"\nDEFAULT_REGISTRY_PATH = DEFAULT_BANK_DIR / "knowledge_nodes.json"\nDEFAULT_MANIFEST_PATH = DEFAULT_BANK_DIR / "bank_manifest.json"\nQUESTION_BANK_FILES = {\n'''
          assert old in text, 'validator path block not found'
          text = text.replace(old, new, 1)
          old = '''EXPECTED_QUESTION_COUNT = 1737\nEXPECTED_IDS = {f"Q{number}" for number in range(1, EXPECTED_QUESTION_COUNT + 1)}\n'''
          new = '''\ndef _load_declared_manifest(path: Path = DEFAULT_MANIFEST_PATH) -> dict[str, Any]:\n    data = json.loads(path.read_text(encoding="utf-8-sig"))\n    if not isinstance(data, dict):\n        raise ValueError("bank_manifest.json must contain a JSON object")\n    required = {\n        "bank_version", "first_question_number", "last_question_number", "question_count"\n    }\n    missing = required - set(data)\n    if missing:\n        raise ValueError(f"bank_manifest.json missing: {sorted(missing)}")\n    first = data["first_question_number"]\n    last = data["last_question_number"]\n    count = data["question_count"]\n    if not isinstance(data["bank_version"], str) or not data["bank_version"].strip():\n        raise ValueError("bank_manifest.json bank_version must be a non-empty string")\n    if not all(type(value) is int for value in (first, last, count)):\n        raise ValueError("bank_manifest.json range/count values must be integers")\n    if first < 1 or last < first or count != last - first + 1:\n        raise ValueError("bank_manifest.json range/count contract is inconsistent")\n    return data\n\n\n_DECLARED_MANIFEST = _load_declared_manifest()\nFIRST_QUESTION_NUMBER = _DECLARED_MANIFEST["first_question_number"]\nLAST_QUESTION_NUMBER = _DECLARED_MANIFEST["last_question_number"]\nEXPECTED_QUESTION_COUNT = _DECLARED_MANIFEST["question_count"]\nEXPECTED_IDS = {\n    f"Q{number}" for number in range(FIRST_QUESTION_NUMBER, LAST_QUESTION_NUMBER + 1)\n}\n'''
          assert old in text, 'validator hard-coded range block not found'
          path.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Backfill audit: validate IDs against the fail-closed loaded bank, not a manual upper bound.
          path = Path('scripts/backfill_node_learning_history.py')
          text = path.read_text(encoding='utf-8')
          old = 'from question_bank import get_question_tag\n'
          new = 'from question_bank import get_question_tag, question_ids\n\n\nFORMAL_QUESTION_IDS = frozenset(question_ids())\n'
          assert old in text, 'backfill import not found'
          text = text.replace(old, new, 1)
          old = '    return number if 1 <= number <= 1737 else None\n'
          new = '    return number if f"Q{number}" in FORMAL_QUESTION_IDS else None\n'
          assert old in text, 'backfill hard-coded bound not found'
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Add schema/manifest consistency checker
        shell: bash
        run: |
          cat > scripts/check_question_bank_schema_manifest.py <<'PY'
          from __future__ import annotations

          import json
          import re
          from pathlib import Path

          ROOT = Path(__file__).resolve().parents[1]
          BANK_DIR = ROOT / 'data' / 'question_bank'
          MANIFEST = BANK_DIR / 'bank_manifest.json'
          SCHEMA = BANK_DIR / 'schema' / 'question_bank_schema_v1.json'


          def check_schema_manifest() -> dict[str, object]:
              manifest = json.loads(MANIFEST.read_text(encoding='utf-8-sig'))
              schema = json.loads(SCHEMA.read_text(encoding='utf-8-sig'))
              first = int(manifest['first_question_number'])
              last = int(manifest['last_question_number'])
              count = int(manifest['question_count'])
              if count != last - first + 1:
                  raise ValueError('manifest range/count mismatch')
              for name in ('questions', 'answers', 'explanations', 'question_tags'):
                  item = schema['properties'][name]
                  if item.get('minItems') != count or item.get('maxItems') != count:
                      raise ValueError(f'{name}: schema count is stale relative to manifest')
              pattern = schema['$defs']['qid']['pattern']
              if re.fullmatch(pattern, f'Q{first}') is None or re.fullmatch(pattern, f'Q{last}') is None:
                  raise ValueError('schema QID pattern does not include declared range')
              if re.fullmatch(pattern, f'Q{last + 1}') is not None:
                  raise ValueError('schema QID pattern accepts ID above declared range')
              return {
                  'bank_version': manifest['bank_version'],
                  'first_question_number': first,
                  'last_question_number': last,
                  'question_count': count,
              }


          def main() -> int:
              print(json.dumps(check_schema_manifest(), ensure_ascii=False, sort_keys=True))
              return 0


          if __name__ == '__main__':
              raise SystemExit(main())
          PY
          cat > tests/test_question_bank_manifest.py <<'PY'
          import copy
          import json

          import pytest

          import question_bank
          from scripts.check_question_bank_schema_manifest import check_schema_manifest


          def test_runtime_declared_range_comes_from_manifest():
              result = check_schema_manifest()
              assert result['question_count'] == 1737
              assert result['first_question_number'] == 1
              assert result['last_question_number'] == 1737
              assert question_bank.QUESTION_BANK_VERSION == result['bank_version']
              assert question_bank.EXPECTED_QUESTION_COUNT == result['question_count']
              assert len(question_bank.EXPECTED_QUESTION_IDS) == result['question_count']
              assert 'Q1' in question_bank.EXPECTED_QUESTION_IDS
              assert 'Q1737' in question_bank.EXPECTED_QUESTION_IDS


          def test_manifest_range_count_contract_is_fail_closed(tmp_path):
              source = question_bank.BANK_MANIFEST_PATH
              data = json.loads(source.read_text(encoding='utf-8-sig'))
              broken = copy.deepcopy(data)
              broken['question_count'] = data['question_count'] - 1
              path = tmp_path / 'bank_manifest.json'
              path.write_text(json.dumps(broken), encoding='utf-8')
              original = question_bank.BANK_MANIFEST_PATH
              try:
                  question_bank.BANK_MANIFEST_PATH = path
                  with pytest.raises(ValueError):
                      question_bank._load_bank_manifest()
              finally:
                  question_bank.BANK_MANIFEST_PATH = original
          PY
      - name: Verify focused contract
        run: |
          python scripts/check_question_bank_schema_manifest.py
          python scripts/validate_question_bank.py
          pytest -q tests/test_question_bank_manifest.py tests/test_question_bank.py tests/test_question_bank_schema.py
      - name: Commit deterministic refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add question_bank.py scripts/validate_question_bank.py scripts/backfill_node_learning_history.py scripts/check_question_bank_schema_manifest.py tests/test_question_bank_manifest.py
          if git diff --cached --quiet; then
            echo 'No refactor changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: centralize question bank range via manifest [aoi-manifest-auto]'
          git push origin HEAD:feature/question-bank-manifest-v01
