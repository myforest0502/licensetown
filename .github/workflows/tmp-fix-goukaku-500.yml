name: tmp-fix-goukaku-500
on:
  push:
    branches:
      - fix/goukaku-500-evidence-node-grouping-v01
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/goukaku-500-evidence-node-grouping-v01
      - name: Patch evidence-node grouping and regression test
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('phase11_active_weakness.py')
          text = p.read_text(encoding='utf-8')
          text = text.replace(
              'from knowledge_node_canonical import canonicalize_knowledge_node_id\n',
              'from question_equivalence import canonicalize_question_evidence_node\n',
          )
          old = '''    histories: dict[str, list[dict[str, Any]]] = defaultdict(list)\n    for item in attempts:\n        node = canonicalize_knowledge_node_id(\n            str(item.get("knowledge_node_id") or "")\n        )\n        if not node or not item.get("question_id"):\n            continue\n        histories[node].append(item)\n'''
          new = '''    histories: dict[str, list[dict[str, Any]]] = defaultdict(list)\n    for item in attempts:\n        question_id = str(item.get("question_id") or "")\n        node = canonicalize_question_evidence_node(\n            question_id,\n            str(item.get("knowledge_node_id") or ""),\n        )\n        if not node or not question_id:\n            continue\n        histories[str(node)].append(item)\n'''
          if old not in text:
              raise SystemExit('target grouping block not found')
          p.write_text(text.replace(old, new), encoding='utf-8')

          test = Path('tests/test_phase11_active_weakness_equivalence.py')
          test.write_text('''from datetime import datetime, timezone\n\nfrom phase11_active_weakness import build_active_repair_weakness\n\n\ndef _attempt(question_id, node_id, minute):\n    return {\n        "user_id": "u1",\n        "question_id": question_id,\n        "knowledge_node_id": node_id,\n        "is_correct": False,\n        "confidence": 1,\n        "answer_status": "wrong",\n        "attempted_at": datetime(2026, 9, 9, 9, minute, tzinfo=timezone.utc),\n    }\n\n\ndef test_active_weakness_groups_by_derived_evidence_node_for_cross_node_exact_repeat():\n    attempts = [\n        _attempt("Q1585", "KN0659", 0),\n        _attempt("Q9999", "KN0659", 1),\n    ]\n\n    result = build_active_repair_weakness(\n        attempts,\n        as_of=datetime(2026, 9, 9, 10, 0, tzinfo=timezone.utc),\n    )\n\n    assert set(result) == {"KN0659", "KN1387"}\n    assert result["KN1387"]["active_evaluable_wrong_question_ids"] == ["Q1585"]\n    assert result["KN0659"]["active_evaluable_wrong_question_ids"] == ["Q9999"]\n''', encoding='utf-8')

          state = Path('docs/CURRENT_STATE.md')
          s = state.read_text(encoding='utf-8')
          marker = '## Current completion contract — MAIN LINE ONLY\n'
          note = '''## 2026-09-09 Production blocker: 合格への道 500\n\n- Real learner reported HTTP 500 on `/goukaku-no-michi`. Render traceback confirmed `ValueError: attempts must belong to one user and one canonical Node`.\n- Root cause: `phase11_active_weakness.build_active_repair_weakness()` grouped histories by raw/canonical Knowledge Node only, while exact-repeat evidence can deliberately remap a question to a different derived evidence Node (`Q1585`: raw `KN0659` -> evidence `KN1387`). This mixed two evidence Nodes in one history and violated the formal state-transition invariant.\n- Fix branch: `fix/goukaku-500-evidence-node-grouping-v01`. Group active-weakness histories by `canonicalize_question_evidence_node(question_id, raw_node_id)` so grouping matches the same derived evidence authority used by `knowledge_node_state_transition.py`.\n- Regression coverage explicitly includes the cross-node exact-repeat case.\n- Status at branch creation: **real Production failure observed: YES / root cause identified: YES / code fix pending validation / Production accepted: NO**.\n\n'''
          if note not in s:
              if marker not in s:
                  raise SystemExit('CURRENT_STATE insertion marker not found')
              s = s.replace(marker, note + marker, 1)
              state.write_text(s, encoding='utf-8')
          PY
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
      - name: Run targeted regression tests
        run: |
          python -m pytest -q tests/test_phase11_active_weakness_equivalence.py tests/test_knowledge_node_state_transition.py
      - name: Commit repair
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase11_active_weakness.py tests/test_phase11_active_weakness_equivalence.py docs/CURRENT_STATE.md
          git commit -m "Fix goukaku evidence-node grouping" || exit 0
          git push origin HEAD:fix/goukaku-500-evidence-node-grouping-v01
