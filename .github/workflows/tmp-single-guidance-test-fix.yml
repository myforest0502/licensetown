name: temporary single guidance test update

on:
  push:
    branches:
      - work/dashboard-single-guidance-authority-v02

permissions:
  contents: write

jobs:
  patch-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/dashboard-single-guidance-authority-v02
      - name: Update stale learner guidance expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          edits = {
              Path('tests/test_field_progress_ui.py'): [
                  ('assert "今日のおすすめ学習" in text', 'assert "今日やること" in text'),
              ],
              Path('tests/test_goukaku_ui.py'): [
                  ('assert "今日のおすすめ学習" in text', 'assert "今日やること" in text'),
                  ('assert "おすすめ進捗" in text', 'assert "今日の学習を始める" in text'),
                  ('guidance_labels = ["優先課題 TOP3", "今日のおすすめ学習", "源さんの一言"]',
                   'guidance_labels = ["今日やること", "源さんの一言"]'),
                  ('assert "100問を目標に基礎を固めましょう" in home_text',
                   'assert "今日やること" in home_text'),
              ],
              Path('tests/test_learner_goukaku_navigation_ui.py'): [
                  ('assert "今日の学習ナビで確認" in text',
                   'assert "今日の学習ナビで確認" not in text\n    assert "内科学" not in text'),
              ],
              Path('tests/test_learning_stats.py'): [
                  ('assert "おすすめ進捗 0 / 10問" in text',
                   'assert "今日の学習を始める" in text'),
              ],
              Path('tests/test_overall_progress_ui.py'): [
                  ('assert "チャレンジする！" in owner',
                   'assert "今日の学習を始める" in owner'),
              ],
          }

          for path, replacements in edits.items():
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'missing expected text in {path}: {old}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit regression updates
        run: |
          git config user.name "LicenseTown CI"
          git config user.email "licensetown.support@gmail.com"
          git add tests/test_field_progress_ui.py tests/test_goukaku_ui.py tests/test_learner_goukaku_navigation_ui.py tests/test_learning_stats.py tests/test_overall_progress_ui.py
          git diff --cached --quiet && exit 0
          git commit -m "Update single guidance authority expectations"
          git push origin HEAD:work/dashboard-single-guidance-authority-v02
