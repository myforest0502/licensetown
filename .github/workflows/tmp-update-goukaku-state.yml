name: tmp-update-goukaku-state
on:
  push:
    branches:
      - docs/goukaku-500-resolution-state-v01
permissions:
  contents: write
jobs:
  update-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/goukaku-500-resolution-state-v01
      - name: Update blocker resolution status
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text(encoding='utf-8')
          old = '- Status at branch creation: **real Production failure observed: YES / root cause identified: YES / code fix pending validation / Production accepted: NO**.'
          new = '- Resolution status: **real Production failure observed: YES / root cause identified: YES / targeted regression: 21 passed / full CI run #632: 1233 passed, 6 skipped, 1 deselected, 125 subtests passed / PR #288 merged to main at `c1209ebb2c7a38df95e532831e5a31e49cff400d` / Render deploy `dep-dagjv59srm7s73fh96ug`: live / real post-fix learner-device acceptance: PENDING**.'
          if old not in s:
              raise SystemExit('expected blocker status line not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit state update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_STATE.md
          git commit -m "Record goukaku 500 resolution state"
          git push origin HEAD:docs/goukaku-500-resolution-state-v01
