name: qb2000 lot01 targets once

on:
  push:
    branches:
      - analysis/qb2000-remaining-allocation-v01
    paths:
      - reports/question_bank_2000_lot01_targets_v01.py
      - .github/workflows/qb2000_lot01_targets_once.yml

permissions:
  contents: write

jobs:
  select:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/qb2000-remaining-allocation-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Select Lot01 targets
        run: python reports/question_bank_2000_lot01_targets_v01.py
      - name: Commit target roster and remove one-shot workflow
        run: |
          rm .github/workflows/qb2000_lot01_targets_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/question_bank_2000_lot01_targets_v01.json .github/workflows/qb2000_lot01_targets_once.yml
          git commit -m "Record Question Bank 2000 Lot01 targets"
          git push
