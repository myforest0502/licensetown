name: qb2000 lot01 chunk02 reference once

on:
  push:
    branches:
      - analysis/qb2000-remaining-allocation-v01

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/qb2000-remaining-allocation-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Build Chunk02 formal reference packet
        run: python -m reports.question_bank_2000_lot01_reference_packet 2
      - name: Commit packet and remove one-shot workflow
        run: |
          rm .github/workflows/qb2000_lot01_chunk02_reference_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/question_bank_2000_lot01_reference_packets/chunk_02.json .github/workflows/qb2000_lot01_chunk02_reference_once.yml
          git commit -m "Record Lot01 Chunk02 formal reference packet"
          git push
