name: qb2000-lot04-promote-formal

on:
  push:
    branches: [work/qb2000-lot04-active]
    paths:
      - '.github/workflows/qb2000-lot04-promote-formal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote-lot04:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONPATH: .
      OPENAI_API_KEY: test-key
      CHANNEL_ACCESS_TOKEN: test-token
      CHANNEL_SECRET: test-secret
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qb2000-finish
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Import only reviewed Lot04 integration inputs from work branch
        run: |
          git fetch origin work/qb2000-lot04-active
          git checkout origin/work/qb2000-lot04-active -- \
            staging/question_bank_2000_lot04_v01.json \
            reports/question_bank_2000_lot04_validate.py \
            reports/question_bank_2000_lot04_targets_v01.json \
            reports/question_bank_2000_remaining_allocation_v01.py \
            scripts/integrate_question_bank_2000_lot04.py \
            scripts/set_question_bank_2000_lot04_new_node_prerequisites.py \
            tests/test_question_bank_2000_lot04_integration.py
          git diff --check
      - name: Verify protected formal baseline and sealed staging
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest=json.loads(Path('data/question_bank/bank_manifest.json').read_text(encoding='utf-8-sig'))
          assert manifest == {'bank_version':'2026-09-b17','first_question_number':1,'last_question_number':1905,'question_count':1905}, manifest
          staging=json.loads(Path('staging/question_bank_2000_lot04_v01.json').read_text(encoding='utf-8-sig'))
          assert len(staging['drafts'])==48
          assert staging.get('formal_hash_format')=='sha256-lf-normalized-v1'
          assert all(d.get('reviewed_sha256') for d in staging['drafts'])
          PY
      - name: Run atomic/idempotent Lot04 dry-run integration test
        run: python -m pytest -q tests/test_question_bank_2000_lot04_integration.py
      - name: Integrate Q1906-Q1953 formally in runner
        run: |
          python -m scripts.integrate_question_bank_2000_lot04
          python -m scripts.set_question_bank_2000_lot04_new_node_prerequisites
          python -m scripts.generate_question_tags_audit
          python -m reports.question_bank_2000_remaining_allocation_v01
      - name: Verify formal result contract before full suite
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          bank=Path('data/question_bank')
          manifest=json.loads((bank/'bank_manifest.json').read_text(encoding='utf-8-sig'))
          assert manifest['question_count']==1953 and manifest['last_question_number']==1953 and manifest['bank_version']=='2026-09-b18', manifest
          for name in ('questions.json','answers.json','explanations.json','question_tags.json'):
              rows=json.loads((bank/name).read_text(encoding='utf-8-sig'))
              assert len(rows)==1953 and rows[-1]['id']=='Q1953', (name,len(rows),rows[-1]['id'])
          nodes=json.loads((bank/'knowledge_nodes.json').read_text(encoding='utf-8-sig'))
          ids={x['knowledge_node_id'] for x in nodes}
          assert all(f'KN{i:04d}' in ids for i in range(1552,1556))
          tags={x['id']:x for x in json.loads((bank/'question_tags.json').read_text(encoding='utf-8-sig'))}
          assert [tags[f'Q{i}']['knowledge_node_id'] for i in range(1950,1954)] == [f'KN{i:04d}' for i in range(1552,1556)]
          assert all(tags[f'Q{i}'].get('prerequisite_nodes') for i in range(1950,1954))
          remaining=json.loads(Path('reports/question_bank_2000_remaining_allocation_v01.json').read_text(encoding='utf-8'))
          assert remaining['current_formal_end']==1953
          assert remaining['original_remaining']==41
          assert remaining['past_exam_remaining']==6
          assert remaining['total_remaining']==47
          PY
          python -m pytest -q tests/test_question_bank_2000_lot04_integration.py
          git diff --check
      - name: Run full test suite
        run: python -m pytest -q --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8
      - name: Commit directly to qb2000-finish only after all gates pass
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/question_bank reports/question_bank_2000_lot04_validate.py reports/question_bank_2000_lot04_targets_v01.json reports/question_bank_2000_remaining_allocation_v01.py reports/question_tags_audit.txt reports/question_bank_2000_remaining_allocation_v01.json docs/question-bank-2000-remaining-allocation-v01.md staging/question_bank_2000_lot04_v01.json scripts/integrate_question_bank_2000_lot04.py scripts/set_question_bank_2000_lot04_new_node_prerequisites.py tests/test_question_bank_2000_lot04_integration.py
          git diff --cached --check
          git commit -m "Integrate Question Bank 2000 Lot04 Q1906-Q1953 [lot04-formal-integrated]"
          git push origin HEAD:qb2000-finish
