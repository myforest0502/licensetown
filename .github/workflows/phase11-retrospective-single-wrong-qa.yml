name: Phase11 Retrospective Single-Wrong QA

"on":
  push:
    branches:
      - fix/retrospective-single-wrong-diagnostic-v01
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/retrospective-single-wrong-diagnostic-v01
      - name: Apply patch
        run: |
          python scripts/apply_retrospective_single_wrong_patch.py
          if ! git diff --quiet -- phase11_retrospective_shadow_audit.py templates/goukaku/supporter_pilot_diagnostics.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add phase11_retrospective_shadow_audit.py templates/goukaku/supporter_pilot_diagnostics.html
            git commit -m "Correct retrospective single-wrong diagnostic"
            git push origin HEAD:fix/retrospective-single-wrong-diagnostic-v01
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest "Werkzeug<3"
      - name: Focused
        run: python -m pytest -q tests/test_phase11_retrospective_single_wrong_diagnostic.py tests/test_phase11_retrospective_shadow_audit.py tests/test_supporter.py
      - name: Full
        run: >-
          python -m pytest -q
          --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8
      - name: Validator
        run: python scripts/validate_question_bank.py
