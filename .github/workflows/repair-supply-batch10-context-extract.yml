name: Repair Supply Batch10 Context Extract
on:
  push:
    branches:
      - analysis/repair-supply-phase2-batch10-context
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/repair-supply-phase2-batch10-context
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python scripts/summarize_repair_supply_batch10_top5.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/repair-supply-phase2-batch10-top5-source-context.md
          if ! git diff --cached --quiet; then
            git commit -m "docs: extract Repair Supply batch10 source context"
            git push origin HEAD:analysis/repair-supply-phase2-batch10-context
          fi
