name: qb2000-lot02-active-ci

on:
  pull_request:

permissions:
  contents: write

jobs:
  validate-lot02:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: .
      OPENAI_API_KEY: test-key
      CHANNEL_ACCESS_TOKEN: test-token
      CHANNEL_SECRET: test-secret
      DATABASE_URL: ""
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Detect Lot02 formal state
        id: state
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          manifest = json.loads(Path('data/question_bank/bank_manifest.json').read_text(encoding='utf-8-sig'))
          count = int(manifest['question_count'])
          if count not in (1809, 1857):
              raise SystemExit(f'unexpected formal question_count: {count}')
          print(f'integrated={str(count == 1857).lower()}')
          print(f'count={count}')
          PY
      - name: Rebuild deterministic Lot02 target roster
        if: steps.state.outputs.integrated == 'false'
        run: python -m reports.question_bank_2000_lot02_targets_v01
      - name: Validate all Lot02 chunks and audits
        if: steps.state.outputs.integrated == 'false'
        run: |
          for n in 1 2 3 4 5 6; do
            python -m reports.question_bank_2000_lot02_chunk_validate $n
            python -m reports.question_bank_2000_lot02_similarity_audit $n
          done
      - name: Merge, seal and final-validate Lot02
        if: steps.state.outputs.integrated == 'false'
        run: |
          python -m reports.question_bank_2000_lot02_chunks merge
          python -m reports.question_bank_2000_lot02_seal
          python -m reports.question_bank_2000_lot02_validate
      - name: Run pre-integration Lot02 tests
        if: steps.state.outputs.integrated == 'false'
        run: >-
          python -m pytest -q
          tests/test_question_bank_2000_lot02_chunk_validator.py
          tests/test_question_bank_2000_lot02_target_allocation.py
          tests/test_question_bank_2000_lot02_pipeline.py
          tests/test_question_bank_2000_lot02_integration.py
      - name: Integrate Q1810-Q1857 formally
        if: steps.state.outputs.integrated == 'false'
        run: |
          python -m scripts.integrate_question_bank_2000_lot02
          python -m scripts.set_question_bank_2000_lot02_new_node_prerequisites
          python -m scripts.generate_question_tags_audit
      - name: Validate formal bank and runtime strong pairs
        run: |
          python -m pytest -q tests/test_question_bank_2000_lot02_integration.py
          python -m pytest -q
          git diff --check
      - name: Commit formal Lot02 integration
        if: steps.state.outputs.integrated == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/question_bank staging/question_bank_2000_lot02_v01.json reports/question_bank_2000_lot02_targets_v01.json
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No formal integration changes to commit"
            exit 0
          fi
          git commit -m "Integrate Question Bank 2000 Lot02 Q1810-Q1857 [lot02-formal-integrated]"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
      - name: Upload Lot02 validation artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qb2000-lot02-validation
          if-no-files-found: warn
          path: |
            reports/question_bank_2000_lot02_targets_v01.json
            reports/question_bank_2000_lot02_similarity_audits/*.json
            staging/question_bank_2000_lot02_v01.json
