name: qb2000 lot01 chunks once

on:
  push:
    branches:
      - analysis/qb2000-remaining-allocation-v01

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: analysis/qb2000-remaining-allocation-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Split Lot01 authoring seed
        run: python reports/question_bank_2000_lot01_chunks.py split
      - name: Commit chunks and remove one-shot workflow
        run: |
          rm .github/workflows/qb2000_lot01_chunks_once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add staging/question_bank_2000_lot01_chunks_v01 .github/workflows/qb2000_lot01_chunks_once.yml
          git commit -m "Record Question Bank 2000 Lot01 authoring chunks"
          git push
