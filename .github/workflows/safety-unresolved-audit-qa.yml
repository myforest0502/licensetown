name: Safety Unresolved Audit QA
on:
  push:
    branches: [fix/safety-unresolved-audit-reason-v01]
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/safety-unresolved-audit-reason-v01
      - name: Apply exact Safety unresolved patch
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('adaptive_question_selector.py')
          text = path.read_text(encoding='utf-8')
          replacements = [
            ('''REPAIR_REASONS = {\n    "safety_wrong", "confident_wrong", "cross_question_wrong", "repairing",\n    "previous_wrong_unconfirmed",\n}''', '''REPAIR_REASONS = {\n    "safety_wrong", "safety_unresolved", "confident_wrong",\n    "cross_question_wrong", "repairing", "previous_wrong_unconfirmed",\n}'''),
            ('''        "wrong_questions": set(), "correct_questions": set(),\n        "confident_wrong": False, "uncertain_correct": False, "unknown": False,''', '''        "wrong_questions": set(), "evaluable_wrong_questions": set(),\n        "correct_questions": set(), "confident_wrong": False,\n        "uncertain_correct": False, "unknown": False,'''),
            ('''        else:\n            summary["wrong_questions"].add(question_id)\n            summary["unknown"] = summary["unknown"] or is_unknown\n            summary["confident_wrong"] = (\n                summary["confident_wrong"] or item.get("confidence") == 1\n            )''', '''        else:\n            summary["wrong_questions"].add(question_id)\n            if not is_unknown:\n                summary["evaluable_wrong_questions"].add(question_id)\n            summary["unknown"] = summary["unknown"] or is_unknown\n            summary["confident_wrong"] = (\n                summary["confident_wrong"] or (not is_unknown and item.get("confidence") == 1)\n            )'''),
            ('''def _priority(state: str, summary: dict[str, Any], safety: str) -> tuple[int, str, str]:\n    has_wrong = bool(summary["wrong_questions"])''', '''def _priority(state: str, summary: dict[str, Any], safety: str) -> tuple[int, str, str]:\n    has_wrong = bool(summary["wrong_questions"])\n    has_evaluable_wrong = bool(summary.get("evaluable_wrong_questions", summary["wrong_questions"]))'''),
            ('''    if has_wrong and safety in {"critical", "high", "moderate"}:\n        return 1000, "safety_wrong", "repair"\n    if summary["confident_wrong"]:''', '''    if has_evaluable_wrong and safety in {"critical", "high", "moderate"}:\n        return 1000, "safety_wrong", "repair"\n    if summary["unknown"] and safety in {"critical", "high", "moderate"}:\n        return 1000, "safety_unresolved", "repair"\n    if summary["confident_wrong"]:'''),
            ('''            "wrong_questions": set(), "correct_questions": set(),\n            "confident_wrong": False, "uncertain_correct": False, "unknown": False,''', '''            "wrong_questions": set(), "evaluable_wrong_questions": set(),\n            "correct_questions": set(), "confident_wrong": False,\n            "uncertain_correct": False, "unknown": False,'''),
            ('''            item["priority_reason"] == "safety_wrong"\n            and item["canonical_node_id"] not in non_recent_nodes''', '''            item["priority_reason"] in {"safety_wrong", "safety_unresolved"}\n            and item["canonical_node_id"] not in non_recent_nodes'''),
          ]
          for old, new in replacements:
              if new in text:
                  continue
              if text.count(old) != 1:
                  raise SystemExit(f'patch target count={text.count(old)}: {old[:50]}')
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')

          test = Path('tests/test_adaptive_question_selector.py')
          body = test.read_text(encoding='utf-8')
          addition = r'''


def test_safety_unknown_only_uses_unresolved_reason_and_preserves_priority(monkeypatch):
    node_by_q = {"Q1": "KN0001"}
    node_by_q.update({f"Q{i}": f"KN{i:04d}" for i in range(2, 45)})
    custom_bank(monkeypatch, node_by_q, {"KN0001": "moderate"})
    selected = selector.select_node_adaptive_questions([
        attempt("Q1", "KN0001", False, None, status="unknown")
    ], 10, rng=random.Random(101))
    node = next(item for item in selected if item["canonical_node_id"] == "KN0001")
    assert node["priority_reason"] == "safety_unresolved"
    assert node["priority_group"] == "repair"
    assert node["priority_score"] >= 820
    assert node["unknown_evidence"] is True
    assert node["recent_question_repeat"] is True
    assert node["recent_cooldown_bypassed"] is True


def test_safety_real_wrong_stays_safety_wrong_even_with_unknown(monkeypatch):
    node_by_q = {"Q1": "KN0001", "Q2": "KN0001"}
    node_by_q.update({f"Q{i}": f"KN{i:04d}" for i in range(3, 45)})
    custom_bank(monkeypatch, node_by_q, {"KN0001": "critical"})
    selected = selector.select_node_adaptive_questions([
        attempt("Q1", "KN0001", False, 2, minute=1),
        attempt("Q2", "KN0001", False, None, status="unknown", minute=2),
    ], 10, rng=random.Random(102))
    node = next(item for item in selected if item["canonical_node_id"] == "KN0001")
    assert node["priority_reason"] == "safety_wrong"


def test_safety_unknown_prefers_nonrecent_same_node_alternate_without_bypass(monkeypatch):
    node_by_q = {"Q1": "KN0001", "Q2": "KN0001"}
    node_by_q.update({f"Q{i}": f"KN{i:04d}" for i in range(3, 45)})
    custom_bank(monkeypatch, node_by_q, {"KN0001": "moderate"})
    monkeypatch.setattr(selector, "classify_repair_confirmation", lambda old, new: (
        "same_question" if old == new else "different_question_weak"
    ))
    selected = selector.select_node_adaptive_questions([
        attempt("Q1", "KN0001", False, None, status="unknown")
    ], 10, rng=random.Random(103))
    node = next(item for item in selected if item["canonical_node_id"] == "KN0001")
    assert node["question_id"] == "Q2"
    assert node["priority_reason"] == "safety_unresolved"
    assert node["recent_question_repeat"] is False
    assert node["recent_cooldown_bypassed"] is False


def test_non_safety_unknown_remains_repairing_and_cannot_use_safety_exception(monkeypatch):
    node_by_q = {"Q1": "KN0001"}
    node_by_q.update({f"Q{i}": f"KN{i:04d}" for i in range(2, 45)})
    custom_bank(monkeypatch, node_by_q)
    selected = selector.select_node_adaptive_questions([
        attempt("Q1", "KN0001", False, None, status="unknown")
    ], 10, rng=random.Random(104))
    assert not any(item["question_id"] == "Q1" for item in selected)
'''
          if 'test_safety_unknown_only_uses_unresolved_reason' not in body:
              test.write_text(body + addition, encoding='utf-8')
          PY
          if ! git diff --quiet -- adaptive_question_selector.py tests/test_adaptive_question_selector.py; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add adaptive_question_selector.py tests/test_adaptive_question_selector.py
            git commit -m 'Separate Safety unresolved from confirmed wrong audit reason'
            git push origin HEAD:fix/safety-unresolved-audit-reason-v01
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest "Werkzeug<3"
      - run: python -m pytest -q tests/test_adaptive_question_selector.py tests/test_phase11_active_safety.py tests/test_phase11_formal_judgment.py tests/test_learning_stats.py
      - run: python -m pytest -q --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8
      - run: python scripts/validate_question_bank.py
