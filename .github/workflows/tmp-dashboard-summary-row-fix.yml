name: tmp-dashboard-summary-row-fix
on:
  push:
    branches:
      - fix/dashboard-summary-row-cache-v01
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-summary-row-cache-v01
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run focused tests
        run: |
          python -m pytest -q tests/test_dashboard_approved_layout.py tests/test_dashboard_product_copy_v01.py
      - name: Run full tests
        run: |
          python -m pytest -q --deselect=tests/test_quiz_answer_numbering.py::ConfigurableQuizTest::test_runtime_loader_supports_current_utf16_and_candidate_utf8
      - name: Update CURRENT_STATE
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/CURRENT_STATE.md')
          s = p.read_text(encoding='utf-8')
          marker = '## Current completion contract — MAIN LINE ONLY\n'
          note = '''## 2026-09-09 Dashboard summary-row production correction\n\n- Real Production screenshot showed PR #294 did not visually satisfy Boss's instruction: the five summary cards still wrapped 3+2 on wide desktop and the new route-card guidance could be hidden by stale asset cache.\n- Root cause: the five-column override was scoped only to 701-1000px, so widths above 1000px fell back to the legacy three-column rule; `dashboard-product-copy-v01.js` and the approved-layout CSS cache keys were also not bumped.\n- Corrective branch: `fix/dashboard-summary-row-cache-v01`. For every viewport >=701px the summary grid is forced to five columns in the fixed order already present in the DOM: total answers / cumulative study time / 7-day accuracy / average accuracy / consecutive learning days. Mobile <=700px is unchanged.\n- Route top-card guidance remains the PR #294 copy and is now forced fresh by cache-key updates. No lower-half layout or other dashboard composition is changed.\n- Status: **real Production mismatch observed: YES / root cause identified: YES / code fix exists: YES / automated validation performed in branch workflow / Production deployed: NO / real-device acceptance: PENDING**.\n\n'''
          if note not in s:
              if marker not in s:
                  raise SystemExit('CURRENT_STATE marker missing')
              s = s.replace(marker, note + marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit state update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/CURRENT_STATE.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record dashboard summary-row correction"
          git push origin HEAD:fix/dashboard-summary-row-cache-v01
