name: temporary supporter learner preview formal patch

on:
  push:
    branches:
      - work/supporter-learner-preview-formal-v02

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/supporter-learner-preview-formal-v02
          fetch-depth: 0
      - name: Make supporter learner preview match formal learner view
        run: |
          python -c 'from pathlib import Path; p=Path("goukaku_ui.py"); t=p.read_text(encoding="utf-8"); old="        dashboard=build_dashboard(learner_id),\n        dashboard_token=None,\n        dashboard_title=\"合格への道\",\n        read_only=False,\n        learner_preview=True,\n"; new="        dashboard=build_dashboard(learner_id, include_learner_navigation=True),\n        dashboard_token=None,\n        dashboard_title=\"合格への道\",\n        read_only=False,\n        learner_preview=True,\n"; assert old in t, "supporter learner preview target not found"; p.write_text(t.replace(old,new,1),encoding="utf-8")'
          if ! grep -q 'def test_supporter_learner_preview_uses_formal_learner_navigation' tests/test_learner_goukaku_navigation_ui.py; then
            echo '' | base64 --decode >> tests/test_learner_goukaku_navigation_ui.py
          fi
          git config user.name "LicenseTown CI"
          git config user.email "licensetown.support@gmail.com"
          git add goukaku_ui.py tests/test_learner_goukaku_navigation_ui.py
          git commit -m "Show formal learner navigation in supporter preview"
          git push origin HEAD:work/supporter-learner-preview-formal-v02
