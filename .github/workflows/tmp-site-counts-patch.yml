name: tmp-site-counts-patch
on:
  push:
    branches:
      - fix/site-question-source-counts-v01
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/site-question-source-counts-v01
      - name: Apply narrow public count fix
        run: |
          echo '' | base64 --decode > /tmp/patch.py
          python /tmp/patch.py
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add site_ui.py tests/test_site_sale_safe.py docs/CURRENT_STATE.md
          git commit -m 'Fix public question source counts'
          git push origin HEAD:fix/site-question-source-counts-v01